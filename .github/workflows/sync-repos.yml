name: Sync External Repos

on:
  schedule:
    # Ejecutar cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutar manualmente
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-repos.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch DWEC Arrays repo structure
        run: |
          mkdir -p tmp_data
          curl -s "https://api.github.com/repos/DavidGom1/Arrays-Js-Practice" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            > tmp_data/dwec-arrays-info.json
          
          curl -s "https://api.github.com/repos/DavidGom1/Arrays-Js-Practice/git/trees/main?recursive=1" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            > tmp_data/dwec-arrays-tree.json

      - name: Fetch DWES Examenes repo structure
        run: |
          curl -s "https://api.github.com/repos/DavidGom1/DWES-Examenes-otros-a-os" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            > tmp_data/dwes-examenes-info.json
          
          curl -s "https://api.github.com/repos/DavidGom1/DWES-Examenes-otros-a-os/git/trees/main?recursive=1" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            > tmp_data/dwes-examenes-tree.json

      - name: Generate combined data file
        run: |
          node << 'EOF'
          const fs = require('fs');
          
          function processRepo(infoFile, treeFile) {
            const info = JSON.parse(fs.readFileSync(infoFile, 'utf8'));
            const tree = JSON.parse(fs.readFileSync(treeFile, 'utf8'));
            
            // Construir estructura de archivos desde el tree
            const files = (tree.tree || []).map(item => ({
              path: item.path,
              type: item.type === 'tree' ? 'dir' : 'file',
              size: item.size || 0
            }));
            
            return {
              name: info.name,
              full_name: info.full_name,
              description: info.description,
              pushed_at: info.pushed_at,
              html_url: info.html_url,
              default_branch: info.default_branch || 'main',
              files: files
            };
          }
          
          const data = {
            repos: {
              'dwec-arrays': processRepo('tmp_data/dwec-arrays-info.json', 'tmp_data/dwec-arrays-tree.json'),
              'dwes-examenes': processRepo('tmp_data/dwes-examenes-info.json', 'tmp_data/dwes-examenes-tree.json')
            }
          };
          
          if (!fs.existsSync('data')) { fs.mkdirSync('data'); }
          fs.writeFileSync('data/repos.json', JSON.stringify(data, null, 2));
          EOF

      - name: Commit and push if changed
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/repos.json
          git add -u data/
          if git diff --quiet --staged; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "🔄 Sync external repos data [skip ci]"
            git push
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Firebase
        if: steps.commit.outputs.changes == 'true'
        run: npm install -g firebase-tools && firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"